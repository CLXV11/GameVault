name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GRADLE_VERSION: "8.7"

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
      - name: Generate wrapper
        run: gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  unit-tests:
    name: JVM unit tests (detection engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
      - name: Generate wrapper
        run: gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Show compiler errors
        if: failure()
        run: |
          echo "=========== ALL COMPILER ERRORS ==========="
          grep -rhE "^e: " app/build 2>/dev/null | head -60 || true
          echo "==========================================="
      - name: Show failing tests
        if: failure()
        run: |
          echo "=========== FAILING TESTS ==========="
          find app/build/test-results -name '*.xml' 2>/dev/null | while read -r f; do
            if grep -q '<failure\|<error' "$f"; then
              echo "--- $f"
              grep -o 'testcase name="[^"]*"[^>]*' "$f" || true
              grep -A8 -E '<failure|<error' "$f" || true
            fi
          done
          echo "=========== COMPILER ERRORS (if any) ==========="
          grep -rE '^e: |error:' . --include='*.log' 2>/dev/null | head -50 || true
          echo "======================================"
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
